<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HaraPlay "H-Wave": the H drawn as level-meter bars. Original artwork,
       MIT licensed with the app. -->
  <rect width="512" height="512" fill="#FFC738"/>
  <defs>
    <g id="bars">
      <rect x="104" y="136" width="48" height="240" rx="14"/>
      <rect x="166.5" y="208" width="50" height="96" rx="14"/>
      <rect x="231" y="174" width="50" height="164" rx="14"/>
      <rect x="295.5" y="218" width="50" height="76" rx="14"/>
      <rect x="360" y="136" width="48" height="240" rx="14"/>
    </g>
  </defs>
  <use href="#bars" transform="translate(14 14)" fill="#16130C"/>
  <use href="#bars" fill="#FBF5E6" stroke="#16130C" stroke-width="12"/>
</svg>
